<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postal enviado · Manu Justel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="img/avatar.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Montserrat:wght@400;600&display=swap">
<style>
  :root{--areia:#F6EDD9;--azul:#001B2E;--cafe:#735947}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:var(--areia);color:var(--azul);font-family:Montserrat,system-ui,sans-serif;text-align:center}
  main{max-width:520px}
  img{width:72px;height:72px;border-radius:50%;background:#fff}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(40px,9vw,64px);line-height:.95;letter-spacing:-.04em;margin:18px 0 12px}
  h1 em{color:var(--cafe);font-weight:500}
  p{font-size:17px;line-height:1.6;margin:0 0 26px}
  a{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:999px;background:var(--azul);color:var(--areia);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="img/avatar.png" alt="">
  <h1>Postal <em>enviado!</em></h1>
  <p>A Manu recebeu a sua mensagem e responde no seu e-mail em breve.</p>
  <a href="/">voltar ao site</a>
</main>
</body>
</html>
